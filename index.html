<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR / Barcode Scanner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
  <div class="container">
    <h2>📷 QR / Barcode Scanner</h2>

    <!-- Kamera tanlash -->
    <select id="cameraSelect"></select>
    <button id="startButton">Start Scanning</button>
    <button id="galleryButton">Scan from Gallery</button>

    <!-- Video -->
    <video id="video" width="300" height="200" style="border:1px solid #ccc;"></video>

    <!-- Natija -->
    <p id="result">None</p>

    <!-- Tugmalar -->
    <button id="copyButton" disabled>📋 Copy</button>
    <button id="sendButton" disabled>📤 Send to Bot</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
