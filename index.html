<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📷 QR / Barcode Scanner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
  <div class="container">
    <h2>📷 QR / Barcode Scanner</h2>
    
    <video id="video" width="300" height="200" style="border:1px solid #ccc;"></video>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <p id="result">None</p>

    <div class="buttons">
      <button id="sendBtn" class="btn green">📤 Send to Bot</button>
      <button id="copyBtn" class="btn blue">📋 Copy</button>
      <button id="galleryBtn" class="btn gray">🖼️ Scan from Gallery</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
